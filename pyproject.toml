[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gchmilew", email = "g.chmile@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=4.1.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
]

[project.scripts]
sandbox = "src.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

